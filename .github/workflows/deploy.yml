name: Deploy

on:
  push:
    branches: [main]

# Required for OIDC: lets the job request a GitHub identity token.
permissions:
  id-token: write
  contents: read

# Never let two deploys race for the same Terraform state lock.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: orbital-decay

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::864144288881:role/orbital-decay-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Your task definition runs on ARM64 Fargate, but the runner is x86.
      # QEMU + buildx let us build an arm64 image on an amd64 machine.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: ./deploy
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=${{ github.sha }}"